[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fempack"
version = "0.2.0"
description = "Small FEM teaching framework"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [ {name = "Diego T. Volpatto", email = "volpatto@lncc.br"} ]
keywords = ["fem", "finite-element", "education"]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "mypy>=1.0",
    "pre-commit>=3.0",
]
notebook = [
    "jupyter>=1.0",
    "ipykernel>=6.0",
    "matplotlib>=3.5",
    "pandas>=1.5",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where  = ["src"]
include = ["fempack*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = [
  "tests",
]
addopts = ". -q -v -m 'not grading'"
markers = [
  "regression: regression tests using pytest-regressions",
  "grading: tests used for grading student assignments",
]
