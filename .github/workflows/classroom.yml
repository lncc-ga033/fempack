name: Autograding Tests

on:
  - push
  - workflow_dispatch

permissions:
  checks: write
  actions: read
  contents: read
  pull-requests: write

jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Poisson 2D MMS Converges
      id: poisson-2d-mms-converges
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Poisson 2D MMS Converges
        setup-command: pip install -e '.[dev]'
        command: pytest -m grading -k test_poisson_2d_mms_converges
        timeout: 600
        max-score: 4
      continue-on-error: true

    - name: L2 H1 Errors Triangle Exact
      id: l2-h1-errors-triangle-exact
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: L2 H1 Errors Triangle Exact
        setup-command: pip install -e '.[dev]'
        command: pytest -m grading -k test_l2_h1_errors_triangle_exact
        timeout: 600
        max-score: 4
      continue-on-error: true

    - name: L2 H1 Errors Convergence Triangle
      id: l2-h1-errors-convergence-triangle
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: L2 H1 Errors Convergence Triangle
        setup-command: pip install -e '.[dev]'
        command: pytest -m grading -k test_l2_h1_errors_convergence_triangle
        timeout: 600
        max-score: 4
      continue-on-error: true

    - name: Assemble Stiffness 2D Triangle
      id: assemble-stiffness-2d-triangle
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Assemble Stiffness 2D Triangle
        setup-command: pip install -e '.[dev]'
        command: pytest -m grading -k test_assemble_stiffness_2d_triangle
        timeout: 600
        max-score: 4
      continue-on-error: true

    - name: Assemble Mass 2D Triangle
      id: assemble-mass-2d-triangle
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Assemble Mass 2D Triangle
        setup-command: pip install -e '.[dev]'
        command: pytest -m grading -k test_assemble_mass_2d_triangle
        timeout: 600
        max-score: 4
      continue-on-error: true

    - name: Assemble Mass 2D Sum
      id: assemble-mass-2d-sum
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Assemble Mass 2D Sum
        setup-command: pip install -e '.[dev]'
        command: pytest -m grading -k test_assemble_mass_2d_sum
        timeout: 600
        max-score: 4
      continue-on-error: true

    - name: Assemble Load 2D Constant
      id: assemble-load-2d-constant
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Assemble Load 2D Constant
        setup-command: pip install -e '.[dev]'
        command: pytest -m grading -k test_assemble_load_2d_constant
        timeout: 600
        max-score: 4
      continue-on-error: true

    - name: Assemble Load 2D Variable
      id: assemble-load-2d-variable
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Assemble Load 2D Variable
        setup-command: pip install -e '.[dev]'
        command: pytest -m grading -k test_assemble_load_2d_variable
        timeout: 600
        max-score: 4
      continue-on-error: true

    - name: Assemble Consistency Triangle vs Quad
      id: assemble-consistency-triangle-vs-quad
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Assemble Consistency Triangle vs Quad
        setup-command: pip install -e '.[dev]'
        command: pytest -m grading -k test_assemble_consistency_triangle_vs_quad
        timeout: 600
        max-score: 4
      continue-on-error: true

    - name: Assemble Refinement Convergence
      id: assemble-refinement-convergence
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Assemble Refinement Convergence
        setup-command: pip install -e '.[dev]'
        command: pytest -m grading -k test_assemble_refinement_convergence
        timeout: 600
        max-score: 4
      continue-on-error: true

    - name: Local Stiffness P1 Triangle
      id: local-stiffness-p1-triangle
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Local Stiffness P1 Triangle
        setup-command: pip install -e '.[dev]'
        command: pytest -m grading -k test_local_stiffness_p1_triangle
        timeout: 600
        max-score: 4
      continue-on-error: true

    - name: Local Stiffness P1 Triangle Positive Definite
      id: local-stiffness-p1-triangle-positive-definite
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Local Stiffness P1 Triangle Positive Definite
        setup-command: pip install -e '.[dev]'
        command: pytest -m grading -k test_local_stiffness_p1_triangle_positive_definite
        timeout: 600
        max-score: 4
      continue-on-error: true

    - name: Local Mass P1 Triangle
      id: local-mass-p1-triangle
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Local Mass P1 Triangle
        setup-command: pip install -e '.[dev]'
        command: pytest -m grading -k test_local_mass_p1_triangle
        timeout: 600
        max-score: 4
      continue-on-error: true

    - name: Local Mass P1 Triangle Sum
      id: local-mass-p1-triangle-sum
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Local Mass P1 Triangle Sum
        setup-command: pip install -e '.[dev]'
        command: pytest -m grading -k test_local_mass_p1_triangle_sum
        timeout: 600
        max-score: 3
      continue-on-error: true

    - name: Local Load P1 Triangle
      id: local-load-p1-triangle
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Local Load P1 Triangle
        setup-command: pip install -e '.[dev]'
        command: pytest -m grading -k test_local_load_p1_triangle
        timeout: 600
        max-score: 3
      continue-on-error: true

    - name: Local Load P1 Triangle Variable
      id: local-load-p1-triangle-variable
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Local Load P1 Triangle Variable
        setup-command: pip install -e '.[dev]'
        command: pytest -m grading -k test_local_load_p1_triangle_variable
        timeout: 600
        max-score: 3
      continue-on-error: true

    - name: Local Matrices Symmetry
      id: local-matrices-symmetry
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Local Matrices Symmetry
        setup-command: pip install -e '.[dev]'
        command: pytest -m grading -k test_local_matrices_symmetry
        timeout: 600
        max-score: 3
      continue-on-error: true

    - name: Triangle Area Unit
      id: triangle-area-unit
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Triangle Area Unit
        setup-command: pip install -e '.[dev]'
        command: pytest -m grading -k test_triangle_area_unit
        timeout: 600
        max-score: 3
      continue-on-error: true

    - name: Triangle Area General
      id: triangle-area-general
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Triangle Area General
        setup-command: pip install -e '.[dev]'
        command: pytest -m grading -k test_triangle_area_general
        timeout: 600
        max-score: 3
      continue-on-error: true

    - name: Triangle Area Larger
      id: triangle-area-larger
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Triangle Area Larger
        setup-command: pip install -e '.[dev]'
        command: pytest -m grading -k test_triangle_area_larger
        timeout: 600
        max-score: 3
      continue-on-error: true

    - name: Triangle Area Invalid Shape
      id: triangle-area-invalid-shape
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Triangle Area Invalid Shape
        setup-command: pip install -e '.[dev]'
        command: pytest -m grading -k test_triangle_area_invalid_shape
        timeout: 600
        max-score: 3
      continue-on-error: true

    - name: Triangle Area Negative Orientation
      id: triangle-area-negative-orientation
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Triangle Area Negative Orientation
        setup-command: pip install -e '.[dev]'
        command: pytest -m grading -k test_triangle_area_negative_orientation
        timeout: 600
        max-score: 3
      continue-on-error: true

    - name: P1 Gradients Unit Triangle
      id: p1-gradients-unit-triangle
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: P1 Gradients Unit Triangle
        setup-command: pip install -e '.[dev]'
        command: pytest -m grading -k test_p1_gradients_unit_triangle
        timeout: 600
        max-score: 3
      continue-on-error: true

    - name: P1 Gradients Sum To Zero
      id: p1-gradients-sum-to-zero
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: P1 Gradients Sum To Zero
        setup-command: pip install -e '.[dev]'
        command: pytest -m grading -k test_p1_gradients_sum_to_zero
        timeout: 600
        max-score: 3
      continue-on-error: true

    - name: P1 Gradients General Triangle
      id: p1-gradients-general-triangle
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: P1 Gradients General Triangle
        setup-command: pip install -e '.[dev]'
        command: pytest -m grading -k test_p1_gradients_general_triangle
        timeout: 600
        max-score: 3
      continue-on-error: true

    - name: P1 Gradients Invalid Shape
      id: p1-gradients-invalid-shape
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: P1 Gradients Invalid Shape
        setup-command: pip install -e '.[dev]'
        command: pytest -m grading -k test_p1_gradients_invalid_shape
        timeout: 600
        max-score: 3
      continue-on-error: true

    - name: P1 Gradients Degenerate Triangle
      id: p1-gradients-degenerate-triangle
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: P1 Gradients Degenerate Triangle
        setup-command: pip install -e '.[dev]'
        command: pytest -m grading -k test_p1_gradients_degenerate_triangle
        timeout: 600
        max-score: 3
      continue-on-error: true

    - name: P1 Gradients Negative Orientation
      id: p1-gradients-negative-orientation
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: P1 Gradients Negative Orientation
        setup-command: pip install -e '.[dev]'
        command: pytest -m grading -k test_p1_gradients_negative_orientation
        timeout: 600
        max-score: 3
      continue-on-error: true

    - name: P1 Gradients Constant On Affine Functions
      id: p1-gradients-constant-on-affine-functions
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: P1 Gradients Constant On Affine Functions
        setup-command: pip install -e '.[dev]'
        command: pytest -m grading -k test_p1_gradients_constant_on_affine_functions
        timeout: 600
        max-score: 3
      continue-on-error: true

    - name: Autograding Reporter
      id: autograding-reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      if: always()
      env:
        POISSON_2D_MMS_CONVERGES_RESULTS: "${{steps.poisson-2d-mms-converges.outputs.result}}"
        L2_H1_ERRORS_TRIANGLE_EXACT_RESULTS: "${{steps.l2-h1-errors-triangle-exact.outputs.result}}"
        L2_H1_ERRORS_CONVERGENCE_TRIANGLE_RESULTS: "${{steps.l2-h1-errors-convergence-triangle.outputs.result}}"
        ASSEMBLE_STIFFNESS_2D_TRIANGLE_RESULTS: "${{steps.assemble-stiffness-2d-triangle.outputs.result}}"
        ASSEMBLE_MASS_2D_TRIANGLE_RESULTS: "${{steps.assemble-mass-2d-triangle.outputs.result}}"
        ASSEMBLE_MASS_2D_SUM_RESULTS: "${{steps.assemble-mass-2d-sum.outputs.result}}"
        ASSEMBLE_LOAD_2D_CONSTANT_RESULTS: "${{steps.assemble-load-2d-constant.outputs.result}}"
        ASSEMBLE_LOAD_2D_VARIABLE_RESULTS: "${{steps.assemble-load-2d-variable.outputs.result}}"
        ASSEMBLE_CONSISTENCY_TRIANGLE_VS_QUAD_RESULTS: "${{steps.assemble-consistency-triangle-vs-quad.outputs.result}}"
        ASSEMBLE_REFINEMENT_CONVERGENCE_RESULTS: "${{steps.assemble-refinement-convergence.outputs.result}}"
        LOCAL_STIFFNESS_P1_TRIANGLE_RESULTS: "${{steps.local-stiffness-p1-triangle.outputs.result}}"
        LOCAL_STIFFNESS_P1_TRIANGLE_POSITIVE_DEFINITE_RESULTS: "${{steps.local-stiffness-p1-triangle-positive-definite.outputs.result}}"
        LOCAL_MASS_P1_TRIANGLE_RESULTS: "${{steps.local-mass-p1-triangle.outputs.result}}"
        LOCAL_MASS_P1_TRIANGLE_SUM_RESULTS: "${{steps.local-mass-p1-triangle-sum.outputs.result}}"
        LOCAL_LOAD_P1_TRIANGLE_RESULTS: "${{steps.local-load-p1-triangle.outputs.result}}"
        LOCAL_LOAD_P1_TRIANGLE_VARIABLE_RESULTS: "${{steps.local-load-p1-triangle-variable.outputs.result}}"
        LOCAL_MATRICES_SYMMETRY_RESULTS: "${{steps.local-matrices-symmetry.outputs.result}}"
        TRIANGLE_AREA_UNIT_RESULTS: "${{steps.triangle-area-unit.outputs.result}}"
        TRIANGLE_AREA_GENERAL_RESULTS: "${{steps.triangle-area-general.outputs.result}}"
        TRIANGLE_AREA_LARGER_RESULTS: "${{steps.triangle-area-larger.outputs.result}}"
        TRIANGLE_AREA_INVALID_SHAPE_RESULTS: "${{steps.triangle-area-invalid-shape.outputs.result}}"
        TRIANGLE_AREA_NEGATIVE_ORIENTATION_RESULTS: "${{steps.triangle-area-negative-orientation.outputs.result}}"
        P1_GRADIENTS_UNIT_TRIANGLE_RESULTS: "${{steps.p1-gradients-unit-triangle.outputs.result}}"
        P1_GRADIENTS_SUM_TO_ZERO_RESULTS: "${{steps.p1-gradients-sum-to-zero.outputs.result}}"
        P1_GRADIENTS_GENERAL_TRIANGLE_RESULTS: "${{steps.p1-gradients-general-triangle.outputs.result}}"
        P1_GRADIENTS_INVALID_SHAPE_RESULTS: "${{steps.p1-gradients-invalid-shape.outputs.result}}"
        P1_GRADIENTS_DEGENERATE_TRIANGLE_RESULTS: "${{steps.p1-gradients-degenerate-triangle.outputs.result}}"
        P1_GRADIENTS_NEGATIVE_ORIENTATION_RESULTS: "${{steps.p1-gradients-negative-orientation.outputs.result}}"
        P1_GRADIENTS_CONSTANT_ON_AFFINE_FUNCTIONS_RESULTS: "${{steps.p1-gradients-constant-on-affine-functions.outputs.result}}"
      with:
        runners: poisson-2d-mms-converges,l2-h1-errors-triangle-exact,l2-h1-errors-convergence-triangle,assemble-stiffness-2d-triangle,assemble-mass-2d-triangle,assemble-mass-2d-sum,assemble-load-2d-constant,assemble-load-2d-variable,assemble-consistency-triangle-vs-quad,assemble-refinement-convergence,local-stiffness-p1-triangle,local-stiffness-p1-triangle-positive-definite,local-mass-p1-triangle,local-mass-p1-triangle-sum,local-load-p1-triangle,local-load-p1-triangle-variable,local-matrices-symmetry,triangle-area-unit,triangle-area-general,triangle-area-larger,triangle-area-invalid-shape,triangle-area-negative-orientation,p1-gradients-unit-triangle,p1-gradients-sum-to-zero,p1-gradients-general-triangle,p1-gradients-invalid-shape,p1-gradients-degenerate-triangle,p1-gradients-negative-orientation,p1-gradients-constant-on-affine-functions

    - name: Post Autograding Results
      uses: actions/github-script@v6
      if: always()
      with:
        script: |
          const points = "${{ steps.autograding-reporter.outputs.points }}" || "0";
          const availablePoints = "${{ steps.autograding-reporter.outputs.available-points }}" || "0";

          // Find the PR associated with this push
          const prs = await github.rest.pulls.list({
            owner: context.repo.owner,
            repo: context.repo.repo,
            head: `${context.repo.owner}:${context.ref.replace('refs/heads/', '')}`,
            state: 'open'
          });

          if (prs.data.length > 0) {
            const pr = prs.data[0];
            await github.rest.issues.createComment({
              issue_number: pr.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Autograding points: ${points}/${availablePoints}`
            });
          }
